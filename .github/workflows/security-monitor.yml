name: Weekly Security Monitor

on:
  schedule:
    - cron: '0 14 * * 1'  # Mondays 14:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  security-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run security monitor
        env:
          # Read-only PAT (or fine-grained token) with access to Dependabot
          # alerts / code scanning alerts / secret scanning alerts across all
          # of the account's repos. The default GITHUB_TOKEN below only ever
          # sees this one repo, so it can't cover the security checks.
          SECURITY_TOKEN: ${{ secrets.SECURITY_MONITOR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: luxemarasound-stack
        run: bash .github/scripts/security-monitor.sh

      - name: Commit and push state
        run: |
          if ! git diff --quiet -- .security-monitor/state.json; then
            git config user.name "security-monitor-bot"
            git config user.email "actions@users.noreply.github.com"
            git add .security-monitor/state.json
            git commit -m "chore: weekly security monitor snapshot"
            git push
          else
            echo "No state changes to commit."
          fi
